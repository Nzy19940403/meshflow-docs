<!DOCTYPE html>
<html>
<body>
<script>
var s = '<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><rect width="512" height="512" rx="256" fill="#0d0d1a"/><circle cx="256" cy="256" r="236" fill="#0d0d1a" stroke="#ffea00" stroke-width="16"/><polygon points="282,92 194,246 256,246 216,420 348,230 278,230 320,92" fill="#ffea00"/></svg>';
var c = document.createElement("canvas");
c.width = 512; c.height = 512;
var ctx = c.getContext("2d");
var img = new Image();
var b = new Blob([s], {type:"image/svg+xml;charset=utf-8"});
var u = URL.createObjectURL(b);
img.onload = function() {
  ctx.drawImage(img, 0, 0, 512, 512);
  URL.revokeObjectURL(u);
  window.d = c.toDataURL("image/png");
  document.title = "DONE";
};
img.onerror = function() { document.title = "ERR"; };
img.src = u;
</script>
</body>
</html>
