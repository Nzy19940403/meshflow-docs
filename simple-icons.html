<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeshFlow 极简头像</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 40px 20px;
  }
  h1 {
    color: #ccccee;
    font-size: 18px;
    font-weight: 300;
    letter-spacing: 4px;
    margin-bottom: 40px;
    opacity: 0.7;
  }
  .grid {
    display: flex;
    gap: 60px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .icon-wrap {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: #0d0d1a;
    border: 2px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .icon-wrap svg {
    width: 160px;
    height: 160px;
  }
  .label {
    color: #7777aa;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .badge {
    color: #444466;
    font-size: 11px;
    background: rgba(255,255,255,0.04);
    padding: 4px 12px;
    border-radius: 20px;
  }
  .preview-row {
    display: flex;
    gap: 20px;
    margin-top: 50px;
    align-items: center;
  }
  .preview-label {
    color: #555577;
    font-size: 12px;
    min-width: 60px;
  }
  .preview-48 { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); }
  .preview-32 { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); }
  .preview-48 svg, .preview-32 svg { width: 100%; height: 100%; }
  .preview-set { display: flex; gap: 12px; }
  .section-title {
    color: #666699;
    font-size: 14px;
    letter-spacing: 3px;
    margin: 40px 0 20px;
    opacity: 0.5;
  }
</style>
</head>
<body>

<h1>✦ MESHFLOW 服务器头像</h1>

<div class="grid">

  <!-- Icon 1: Flow Dot -->
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" fill="#0d0d1a" stroke="#00d4ff" stroke-width="5"/>
        <circle cx="50" cy="50" r="18" fill="#00d4ff"/>
        <circle cx="50" cy="50" r="8" fill="#0d0d1a"/>
        <circle cx="30" cy="30" r="6" fill="#00d4ff" opacity="0.5"/>
        <circle cx="70" cy="30" r="6" fill="#00d4ff" opacity="0.5"/>
        <circle cx="30" cy="70" r="6" fill="#00d4ff" opacity="0.5"/>
        <circle cx="70" cy="70" r="6" fill="#00d4ff" opacity="0.5"/>
      </svg>
    </div>
    <span class="label">Flow Dot</span>
    <span class="badge">环形 + 中心点 + 四角信号</span>
  </div>

  <!-- Icon 2: M Node -->
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="46" stroke="#b388ff" stroke-width="4"/>
        <text x="50" y="68" text-anchor="middle" font-family="Arial" font-weight="900" font-size="52" fill="#b388ff">M</text>
        <circle cx="50" cy="50" r="3" fill="#b388ff" opacity="0.8"/>
      </svg>
    </div>
    <span class="label">M Node</span>
    <span class="badge">紫色字母 M + 圆环</span>
  </div>

  <!-- Icon 3: Hex Core -->
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="50,5 86,27.5 86,72.5 50,95 14,72.5 14,27.5" stroke="#00e676" stroke-width="4" fill="#0d0d1a"/>
        <circle cx="50" cy="50" r="14" fill="#00e676"/>
        <circle cx="50" cy="50" r="5" fill="#0d0d1a"/>
      </svg>
    </div>
    <span class="label">Hex Core</span>
    <span class="badge">绿色六边形 + 实心圆</span>
  </div>

  <!-- Icon 4: Signal -->
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="44" stroke="#ff6d00" stroke-width="4"/>
        <circle cx="50" cy="50" r="28" stroke="#ff6d00" stroke-width="4" opacity="0.5"/>
        <circle cx="50" cy="50" r="12" stroke="#ff6d00" stroke-width="4" opacity="0.3"/>
        <circle cx="50" cy="50" r="6" fill="#ff6d00"/>
      </svg>
    </div>
    <span class="label">Signal</span>
    <span class="badge">橙色雷达同心圆</span>
  </div>

  <!-- Icon 5: Bolt -->
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="46" stroke="#ffea00" stroke-width="4"/>
        <polygon points="55,18 38,48 50,48 42,82 68,45 54,45 62,18" fill="#ffea00"/>
      </svg>
    </div>
    <span class="label">Bolt</span>
    <span class="badge">黄色闪电 + 圆环</span>
  </div>

  <!-- Icon 6: Network -->
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="3" fill="#00e5ff"/>
        <circle cx="28" cy="50" r="16" stroke="#00e5ff" stroke-width="4" fill="#0d0d1a"/>
        <line x1="40" y1="50" x2="60" y2="50" stroke="#00e5ff" stroke-width="4"/>
        <circle cx="72" cy="50" r="16" stroke="#00e5ff" stroke-width="4" fill="#0d0d1a"/>
        <circle cx="28" cy="50" r="5" fill="#00e5ff"/>
        <circle cx="72" cy="50" r="5" fill="#00e5ff"/>
      </svg>
    </div>
    <span class="label">Network</span>
    <span class="badge">青色双节点联结</span>
  </div>

</div>

<div class="section-title">▼ DISCORD 尺寸预览</div>

<div class="preview-row">
  <span class="preview-label">48px</span>
  <div class="preview-set">
    <div class="preview-48"><svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="45" fill="#0d0d1a" stroke="#00d4ff" stroke-width="5"/><circle cx="50" cy="50" r="18" fill="#00d4ff"/><circle cx="50" cy="50" r="8" fill="#0d0d1a"/><circle cx="30" cy="30" r="6" fill="#00d4ff" opacity="0.5"/><circle cx="70" cy="30" r="6" fill="#00d4ff" opacity="0.5"/><circle cx="30" cy="70" r="6" fill="#00d4ff" opacity="0.5"/><circle cx="70" cy="70" r="6" fill="#00d4ff" opacity="0.5"/></svg></div>
    <div class="preview-48"><svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="46" stroke="#b388ff" stroke-width="4"/><text x="50" y="68" text-anchor="middle" font-family="Arial" font-weight="900" font-size="52" fill="#b388ff">M</text></svg></div>
    <div class="preview-48"><svg viewBox="0 0 100 100" fill="none"><polygon points="50,5 86,27.5 86,72.5 50,95 14,72.5 14,27.5" stroke="#00e676" stroke-width="4" fill="#0d0d1a"/><circle cx="50" cy="50" r="14" fill="#00e676"/><circle cx="50" cy="50" r="5" fill="#0d0d1a"/></svg></div>
    <div class="preview-48"><svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="44" stroke="#ff6d00" stroke-width="4"/><circle cx="50" cy="50" r="28" stroke="#ff6d00" stroke-width="4" opacity="0.5"/><circle cx="50" cy="50" r="12" stroke="#ff6d00" stroke-width="4" opacity="0.3"/><circle cx="50" cy="50" r="6" fill="#ff6d00"/></svg></div>
    <div class="preview-48"><svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="46" stroke="#ffea00" stroke-width="4"/><polygon points="55,18 38,48 50,48 42,82 68,45 54,45 62,18" fill="#ffea00"/></svg></div>
    <div class="preview-48"><svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="3" fill="#00e5ff"/><circle cx="28" cy="50" r="16" stroke="#00e5ff" stroke-width="4" fill="#0d0d1a"/><line x1="40" y1="50" x2="60" y2="50" stroke="#00e5ff" stroke-width="4"/><circle cx="72" cy="50" r="16" stroke="#00e5ff" stroke-width="4" fill="#0d0d1a"/><circle cx="28" cy="50" r="5" fill="#00e5ff"/><circle cx="72" cy="50" r="5" fill="#00e5ff"/></svg></div>
  </div>
</div>

<div class="preview-row">
  <span class="preview-label">32px</span>
  <div class="preview-set">
    <div class="preview-32"><svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="45" fill="#0d0d1a" stroke="#00d4ff" stroke-width="5"/><circle cx="50" cy="50" r="18" fill="#00d4ff"/><circle cx="50" cy="50" r="8" fill="#0d0d1a"/><circle cx="30" cy="30" r="6" fill="#00d4ff" opacity="0.5"/><circle cx="70" cy="30" r="6" fill="#00d4ff" opacity="0.5"/><circle cx="30" cy="70" r="6" fill="#00d4ff" opacity="0.5"/><circle cx="70" cy="70" r="6" fill="#00d4ff" opacity="0.5"/></svg></div>
    <div class="preview-32"><svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="46" stroke="#b388ff" stroke-width="4"/><text x="50" y="68" text-anchor="middle" font-family="Arial" font-weight="900" font-size="52" fill="#b388ff">M</text></svg></div>
    <div class="preview-32"><svg viewBox="0 0 100 100" fill="none"><polygon points="50,5 86,27.5 86,72.5 50,95 14,72.5 14,27.5" stroke="#00e676" stroke-width="4" fill="#0d0d1a"/><circle cx="50" cy="50" r="14" fill="#00e676"/><circle cx="50" cy="50" r="5" fill="#0d0d1a"/></svg></div>
    <div class="preview-32"><svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="44" stroke="#ff6d00" stroke-width="4"/><circle cx="50" cy="50" r="28" stroke="#ff6d00" stroke-width="4" opacity="0.5"/><circle cx="50" cy="50" r="12" stroke="#ff6d00" stroke-width="4" opacity="0.3"/><circle cx="50" cy="50" r="6" fill="#ff6d00"/></svg></div>
    <div class="preview-32"><svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="46" stroke="#ffea00" stroke-width="4"/><polygon points="55,18 38,48 50,48 42,82 68,45 54,45 62,18" fill="#ffea00"/></svg></div>
    <div class="preview-32"><svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="3" fill="#00e5ff"/><circle cx="28" cy="50" r="16" stroke="#00e5ff" stroke-width="4" fill="#0d0d1a"/><line x1="40" y1="50" x2="60" y2="50" stroke="#00e5ff" stroke-width="4"/><circle cx="72" cy="50" r="16" stroke="#00e5ff" stroke-width="4" fill="#0d0d1a"/><circle cx="28" cy="50" r="5" fill="#00e5ff"/><circle cx="72" cy="50" r="5" fill="#00e5ff"/></svg></div>
  </div>
</div>

</body>
</html>
